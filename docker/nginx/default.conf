# Single-use portal links (password and invitation) never reach the access log (review of step 7a.1a).
map $request_uri $logged_uri {
    ~^(?<portal_path>/portal/[^/]+/criar-senha/)  "${portal_path}[omitido]";
    default                                     $request_uri;
}

# The page's own requests (assets, form posts) carry the link as Referer: redacted too.
map $http_referer $logged_referer {
    ~^(?<referer_path>https?://[^/]+/portal/[^/]+/criar-senha/)  "${referer_path}[omitido]";
    default                                                       $http_referer;
}

log_format redacted '$remote_addr - $remote_user [$time_local] "$request_method $logged_uri $server_protocol" '
                    '$status $body_bytes_sent "$logged_referer" "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    access_log /var/log/nginx/access.log redacted;
    # Clinical documents: 10 MB per file plus the rest of the form (docker/php/uploads.ini).
    client_max_body_size 12m;
    server_tokens off;
    # Locations below must not use add_header, or these stop being inherited.
    # HSTS belongs on the TLS terminator in production (README checklist).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    # Script hash = constant inline theme script in resources/views/app.blade.php; update both together.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-+RVF9jcTWD6XtUaUCrTQxQrSXzblt5gxCvBoxQ42+T4='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass app:9000;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known/) { deny all; }
}
